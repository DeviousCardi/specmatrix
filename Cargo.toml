[package]
name = "specmatrix"
version = "0.1.0"
edition = "2021"
description = "Compatibility testing for observability backends"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
