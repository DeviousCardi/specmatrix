[package]
name = "specmatrix"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Compatibility testing for observability backends"
license = "Apache-2.0"
repository = "https://github.com/DeviousCardi/specmatrix"
homepage = "https://github.com/DeviousCardi/specmatrix"
readme = "README.md"
keywords = ["observability", "conformance", "opentelemetry", "prometheus", "testing"]
categories = ["command-line-utilities", "development-tools::testing"]
# The corpus and the adapters are the asset; a published crate that shipped
# only the binary would be missing the part that matters.
include = ["src/**", "cases/**", "backends/**", "README.md", "LICENSE", "NOTICE"]

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic-messages", "logs", "metrics", "with-serde"] }
prost = "0.14"
rand = "0.9"
regex = "1"
reqwest = { version = "0.13", features = ["blocking", "json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
snap = "1.1"
