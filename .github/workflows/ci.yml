name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default. No job here writes anything to the repository, so
# nothing gets a token that could. A workflow that needs more asks for it in
# the job, not here.
permissions:
  contents: read

# A new push to a pull request cancels the run still going for the old one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit, not a tag. A tag can be moved to point
      # at different code without the reference here changing, and a workflow
      # runs whatever it resolves to.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  corpus:
    # Two rules that rot silently, so they are enforced rather than reviewed:
    # every check cites a rule with a basis, and every adapter pins its image.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: every case cites a rule with a basis
        run: python3 tools/check_corpus.py
      - name: every adapter is pinned and startable
        run: cargo test --bin specmatrix docker::tests::every_committed_adapter

  audit:
    # A dependency with a known advisory is a security problem in a tool people
    # are asked to run against their own infrastructure.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
