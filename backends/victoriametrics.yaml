# Adapter for VictoriaMetrics, single-node.
#
# Confirmed by hand against victoriametrics/victoria-metrics:v1.151.0 on
# 2026-09-09:
#
#   $ curl -s localhost:8428/metrics | grep '^vm_app_version'
#   vm_app_version{version="victoria-metrics-20250210-...-tags-v1.111.0-0-g...",
#                  short_version="v1.111.0"} 1
#
# The version is only on the Prometheus metrics endpoint, as text, so it is read
# with a pattern rather than a JSON pointer. A matrix without versions is a
# claim about the past that reads as a claim about the present.
#
# VictoriaMetrics accepts remote-write at /api/v1/write and answers PromQL at
# /api/v1/query, both at the same spellings Prometheus uses, which is what
# makes it a column rather than a translation.

name: victoriametrics
version_from:
  request: GET /metrics
  pattern: 'short_version="([^"]+)"'

container:
  image: victoriametrics/victoria-metrics:v1.151.0
  port: 8428
  ready:
    request: GET /health
    expect_status: 200

auth:
  kind: none

run_key_field: specmatrix_run

protocols:
  remote-write:
    formats: [remote-write-protobuf]
    ingest:
      request: POST /api/v1/write
    readback:
      request: GET /api/v1/query
      params:
        query: '{{ series_selector }}'
        # The instant to ask about, which a check may set. Defaults to now.
        # Without it, the one case that timestamps a sample in the future is
        # asked about the present and reads as data the store lost.
        time: '{{ query_time_s }}'
      records: /data/result
      fields:
        value: /value/1
        labels: /metric
      poll:
        interval_ms: 1000
        # Sixty seconds because of search.latencyOffset, which defaults to 30s:
        # an instant query at time T only considers data up to T-30s, so a
        # sample written now is invisible for half a minute however fast the
        # ingest path is. Confirmed by hand on 2026-09-09 — /api/v1/series
        # listed the series immediately while /api/v1/query returned an empty
        # vector, and the same query answered normally forty seconds later.
        #
        # Waiting it out rather than starting the container with
        # -search.latencyOffset=0. Lowering it would make the suite faster and
        # would be the corpus arranging its own result: the offset is what a
        # user gets, so the offset is what is measured. Waiting changes nothing
        # about what VictoriaMetrics does with a payload.
        timeout_ms: 60000
