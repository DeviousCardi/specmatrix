# Adapter for OpenObserve.
#
# Confirmed by hand against openobserve v0.92.2 on 2026-09-08. Re-confirm when
# bumping the image. Two things differ from what the documentation suggests and
# were only found by inspecting a stored record:
#
#   - the version is at GET /config, not /api/config, which 404s
#   - attribute keys are flattened with `.` replaced by `_`, so the run key is
#     stored as `specmatrix_run`
#
# Corpus payloads carry generated instants rather than fixed historical ones as
# of 0.2, so the checks run against OpenObserve's default ingest window. The
# 0.1 adapter widened ZO_INGEST_ALLOWED_UPTO to 87600 hours because the fixture
# was dated 2025; at the default of 5 hours OpenObserve answers 200 and
# discards the record. That behaviour is the failure class this project exists
# to surface, so it gets a case of its own rather than a setting that hides it:
# cases/otlp-logs/timestamp-outside-ingest-window.yaml.

name: openobserve
version_from:
  request: GET /config
  field: version

container:
  image: openobserve/openobserve:v0.92.2
  port: 5080
  env:
    ZO_ROOT_USER_EMAIL: admin@specmatrix.local
    # Must satisfy OpenObserve's password policy: 8-128 characters with an
    # upper, a lower, a digit and a symbol, or the process exits at start-up.
    ZO_ROOT_USER_PASSWORD: "Specmatrix#2026"
  ready:
    request: GET /healthz
    expect_status: 200

auth:
  kind: basic
  username: admin@specmatrix.local
  password: "Specmatrix#2026"

protocols:
  otlp-logs:
    formats: [otlp-json]
    ingest:
      request: POST /api/default/v1/logs
      headers:
        Content-Type: application/json
        stream-name: "{{ suite_stream }}"
    readback:
      request: POST /api/default/_search
      body:
        query:
          sql: "SELECT * FROM \"{{ suite_stream }}\" WHERE specmatrix_run = '{{ run_key }}'"
          start_time: "{{ window_start_us }}"
          end_time: "{{ window_end_us }}"
      records: /hits
      poll:
        interval_ms: 1000
        timeout_ms: 30000
      # Renames only. Each column holds the value that was sent; nothing here
      # rewrites one. `severityNumber` has no column at all, so a check naming
      # it reads as absent, which is the honest answer.
      fields:
        body: /body
        severityText: /severity
        timeUnixNano: /_timestamp

  # OpenObserve also accepts the Elasticsearch _bulk API, and confirmed by hand
  # on 2026-09-08 it stores what that API is given: all four documents of the
  # es-bulk dataset land and are retrievable.
  #
  # It exposes no Elasticsearch-compatible search endpoint. Every path tried
  # answered 404: /api/{org}/{stream}/_search, /es/{stream}/_search, /es/_search,
  # /api/{org}/_msearch and /api/{org}/{stream}/_msearch. Read-back therefore
  # goes through OpenObserve's own SQL API, which is a rename of the transport
  # and not of any value, and the adapter declares no `query` block at all — so
  # a query-semantics case reads N/A with its reason rather than a verdict.
  #
  # That combination is the finding this column carries: the ingest half of the
  # Elasticsearch API is implemented and the query half is not, so data written
  # through it cannot be read back through it. A migration that assumed the
  # protocol was supported would move the writes and strand the queries.
  #
  # Attribute keys are flattened with `.` replaced by `_`, as on the OTLP path,
  # so `specmatrix.run` is stored as `specmatrix_run`.
  es-bulk:
    formats: [es-ndjson]
    ingest:
      request: POST /api/default/_bulk
      headers:
        Content-Type: application/x-ndjson
    readback:
      request: POST /api/default/_search
      body:
        query:
          sql: "SELECT * FROM \"{{ suite_stream }}\" WHERE specmatrix_run = '{{ run_key }}'"
          start_time: "{{ window_start_us }}"
          end_time: "{{ window_end_us }}"
      records: /hits
      fields:
        message: /message
        level: /level
      poll:
        interval_ms: 1000
        timeout_ms: 30000

  loki-push:
    formats: [loki-json]
    # Confirmed by hand on 2026-09-09 against v0.92.2. openobserve/openobserve
    # PR #7075 documents a stream-naming hierarchy — service, service_name,
    # app, job, in that order — but every push in this version landed in the
    # fixed stream "default" regardless of which of those labels was set, so
    # that is what this adapter queries rather than the documented hierarchy.
    # The push body's `values[][1]` line lands in the field `message`, not
    # `_msg` or `body`; the timestamp comes back as `_timestamp` in
    # microseconds, where Loki's own wire format is nanoseconds; and every
    # stream label is flattened onto the record as a top-level column, so
    # structured metadata and stream labels are indistinguishable once stored.
    ingest:
      request: POST /api/default/loki/api/v1/push
      headers:
        Content-Type: application/json
    readback:
      request: POST /api/default/_search
      body:
        query:
          sql: "SELECT * FROM \"default\" WHERE specmatrix_run = '{{ run_key }}'"
          start_time: "{{ window_start_us }}"
          end_time: "{{ window_end_us }}"
      records: /hits
      fields:
        line: /message
        timestamp: /_timestamp
        # There is no nested labels object to point at — every label lands as
        # its own top-level column alongside `message` and `_timestamp` — so
        # `labels` reads the whole record rather than a label-only subset.
        # `present` mode only reports the difference, it does not fail on it,
        # so this is informative rather than load-bearing.
        labels: ""
        metadata.trace_id: /trace_id
      poll:
        interval_ms: 1000
        timeout_ms: 30000
normalise:
  drop_fields:
    - _timestamp
    - dropped_attributes_count
