id: otlp-metrics/exponential-histogram
protocol: otlp-metrics
title: An exponential histogram is accepted or refused, not silently dropped

rule:
  basis: spec
  spec: opentelemetry/otlp/1.3.0
  section: exponential-histogram-data-point
  text: >
    ExponentialHistogram is a first-class OTLP metric type and is what an SDK
    emits by default for some instruments. A store with no representation for
    it may reasonably refuse the export; accepting it and storing nothing tells
    the sender its data arrived when it did not.
  observed:
    - https://github.com/VictoriaMetrics/VictoriaMetrics/issues/11528
    - https://github.com/GreptimeTeam/greptimedb/issues/8887

send:
  format: otlp-metrics-json
  encodings: [otlp-metrics-json, otlp-metrics-protobuf]
  body: cases/otlp-metrics/exponential-histogram.json

expect:
  ingest: accepted-or-rejected
  readback:
    match: present
    series: specmatrix_otlp_exphist
    # A regex, because the metric is filed under two different shapes.
    # Prometheus and Mimir store it as a native histogram under the bare name;
    # VictoriaMetrics and GreptimeDB convert it to a classic histogram and file
    # the count under `_count`, alongside `_sum` and vmrange-labelled
    # `_bucket` series. Confirmed by hand on 2026-09-09 against all four —
    # querying the bare name alone leaves VM and GreptimeDB permanently
    # `accepted but never became queryable`, which is the read-back failing to
    # find a record that is genuinely there, not the store dropping it.
    stored_as: '{__name__=~"specmatrix_otlp_exphist(_count)?",specmatrix_run="{{ run_key }}"}'
    on:
      # `count`, read at the native-histogram pointer. On the two columns that
      # convert to a classic histogram the selector still finds the `_count`
      # series — the record is present, which is what decides PASS here — but
      # this pointer does not resolve against it, since a classic conversion
      # answers as an ordinary vector rather than a native histogram. The
      # result line reports that honestly as `<absent>` rather than pretending
      # the two shapes are one field.
      - field: count
        as: float

notes: >
  Prometheus has native histograms and can hold this; a store that maps
  everything to classic histograms has to choose between converting, refusing,
  and dropping. Which one it chose is the row.

  Measured 2026-09-09:

    prometheus 3.14.0        PASS   stored as a native histogram
    mimir 3.2.0              PASS   stored as a native histogram
    greptimedb 1.2.0         ALTER  accepted, nothing stored
    victoriametrics 1.151.0  ALTER  accepted, nothing stored

  Both drops confirmed with a control in the same export. Handled differently
  because the upstream situations differ. VictoriaMetrics documents converting
  exponential histograms to its own vmrange format, and no series appears under
  any name — no series anywhere carries a vmrange label — so that is filed as
  VictoriaMetrics#11528. GreptimeDB merged cumulative exponential histogram
  support in #8900 and has an open tracking issue, #8887, for native histogram
  stabilisation and deferred follow-up; this looks like part of that work
  rather than something unreported, so it is linked and recorded instead of
  filed again.
