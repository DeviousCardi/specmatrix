id: remote-write/histogram-nan-count
protocol: remote-write
title: A NaN histogram _count is an ordinary value, not malformed input

rule:
  basis: spec
  spec: prometheus/remote-write/1.0
  section: sample
  text: >
    A Sample value is an IEEE 754 double, and NaN is one. A histogram whose
    _count, _sum and _bucket series all carry NaN is what a scrape of a target
    that has produced no observations looks like after a division by zero, and
    it is ordinary conformant traffic. A receiver that treats NaN as malformed
    refuses it; one that reconciles the series and fabricates a replacement
    value is worse.
  observed:
    - https://github.com/vectordotdev/vector/issues/26228
    - https://github.com/VictoriaMetrics/VictoriaMetrics/issues/7241
    - https://github.com/GreptimeTeam/greptimedb/pull/8494

send:
  format: remote-write-json
  encodings: [remote-write-protobuf]
  body: cases/remote-write/histogram-nan-count.json

expect:
  ingest: accepted
  readback:
    # Two assertions, because the finding is about both. The NaN must survive
    # as NaN, and the unrelated gauge sent in the same request must survive at
    # all: refusing or mangling a batch over one NaN costs data that has
    # nothing to do with it.
    - match: exact
      series: specmatrix_latency_seconds_count
      on:
        - field: value
          as: float
    - match: exact
      series: specmatrix_unrelated_gauge
      on:
        - field: value
          as: float
        - labels

notes: >
  This is not a staleness check, and the distinction was got wrong the first
  time this case was written. Prometheus marks a series stale with one specific
  NaN payload, 0x7ff0000000000002; every other NaN is an ordinary value.
  Confirmed against prom/prometheus:v3.6.0 on 2026-09-09 — the NaN sent here is
  stored and reads back as "NaN", while the reserved payload ends the series.
  stale-marker-hides-series covers that separately.

  The check has two failure modes worth distinguishing. A 400 on the whole
  request is a REJECT and costs every sample batched alongside. Accepting the
  request and emitting the histogram with count 0 is an ALTER, and is worse:
  the value is fabricated, no error is raised, and a dashboard renders it as a
  real measurement.

  Measured 2026-09-09 against the then-current release of each store:

    prometheus 3.14.0        PASS   /api/v1/query returns "NaN"
    mimir 3.2.0              PASS   returns "NaN"
    greptimedb 1.2.0         PASS   returns "NaN"
    victoriametrics 1.151.0  ALTER  discarded at ingest; the series never exists

  VictoriaMetrics drops NaN samples on the way in. /api/v1/export returns
  nothing for the series and /api/v1/series does not list it, while the finite
  series sent in the same request export and list normally; no
  vm_rows_ignored_total counter moves. The write answers 204.

  This is intended and already tracked, which is why it is recorded here and not
  filed again. NaNs are dropped deliberately (PR VictoriaMetrics#6663); the
  counter that reported them was disabled in #7166 because NaN samples turn out
  to be ordinary traffic — node_exporter emits them — and every increment was
  raising an alert; and #7241 is the open request to count them again without
  alerting. The verdict stays ALTER because the verdict is about what a caller
  can observe, and a caller sees 204 and no data.

  GreptimeDB was the instructive one. Version 0.17.2, which was pinned first,
  stored the sample and returned nothing for it through the Prometheus API —
  `select isnan(greptime_value)` answered true while /v1/prometheus/api/v1/query
  returned an empty vector. That was fixed upstream in GreptimeTeam/greptimedb
  #8494, merged 2026-07-15, which made PromQL treat only the reserved
  0x7ff0000000000002 payload as a stale marker and preserve ordinary NaNs.
  v0.17.2 predates it by ten months. Pinning a current release turned a finding
  into a fix already shipped, which is the reason the roster rule exists.

  One near miss worth keeping. GreptimeDB's SQL HTTP API renders a stored NaN as
  JSON `null`, because JSON has no NaN literal. Reading only that output says
  the value was lost. `count(col)` and `IS NULL` say it was not.
