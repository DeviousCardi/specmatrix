id: es-bulk/match-all-run
protocol: es-bulk
title: Every document written by this run is returned
control: true

rule:
  basis: de-facto
  spec: elasticsearch/query-dsl
  section: bool.filter
  text: >
    A control for the query suite, not a divergence. Every other query check
    asserts on a subset of this dataset, so when this does not return all four
    documents the dataset did not land, the run-key filter does not select it,
    or the marker cannot be read — and no other row says anything about the
    backend's query semantics.

send:
  format: es-ndjson
  body: cases/es-bulk/absent-field.ndjson

expect:
  ingest: accepted
  query:
    body: cases/es-bulk/match-all-run.query.json
    returns: [with-field-match, with-field-other, field-absent, field-null]

notes: >
  Elasticsearch 8.15.0, observed 2026-09-08: all four documents.

  Quickwit 0.8.2: PASS, all four documents, confirmed 2026-09-08.

  This control earned its place twice over. At the 30s poll the other adapters
  use, it reported all four rows missing — an ALTER, and a false finding of
  silent data loss on a store that was merely slower than the harness. It then
  caught a defect in the runner itself: run_query settled as soon as two reads
  agreed, and two consecutive empty reads agree, so it returned nothing after
  two polls no matter how long the timeout was. Both were caught before any row
  in this suite was believed, which is exactly what a control is for.
