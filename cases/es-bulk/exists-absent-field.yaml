id: es-bulk/exists-absent-field
protocol: es-bulk
title: An exists query returns only documents carrying a non-null value

rule:
  basis: de-facto
  spec: elasticsearch/query-dsl
  section: exists
  text: >
    An exists query returns documents in which the field is present and
    non-null. Elasticsearch is the reference for this protocol, so its answer
    defines conformance: a field written as null is not indexed and the
    document is excluded, exactly as one that omitted the field is. A backend
    that returns nothing at all because field-presence indexing is disabled has
    answered a question about its own configuration rather than about the data,
    and the caller is not told.
  observed:
    - https://github.com/quickwit-oss/quickwit/issues/6475

send:
  format: es-ndjson
  body: cases/es-bulk/absent-field.ndjson

expect:
  ingest: accepted
  query:
    body: cases/es-bulk/exists-absent-field.query.json
    returns: [with-field-match, with-field-other]

notes: >
  Copied from Elasticsearch 8.15.0 on 2026-09-08:
  [with-field-match, with-field-other]. Both the absent and the null document
  are excluded, which is the answer that makes null and absent equivalent here
  while must_not treats them the same as each other but opposite to this.

  Quickwit 0.8.2: PASS, confirmed 2026-09-08. It returns
  [with-field-match, with-field-other], the same set as Elasticsearch 8.15.0.

  This is the more surprising of the two. quickwit#6475 concerns exists queries
  returning nothing when field-presence indexing is off, and Quickwit's dynamic
  default really is index_field_presence: false — confirmed in the index config
  the adapter's setup request creates. The exists query still answers
  correctly, so whatever the reported failure depends on, it is not that
  default alone on this version. The adapter deliberately leaves the setting at
  its default: turning it on would tune the backend until the check passed.

  OpenObserve v0.92.2: N/A, no Elasticsearch query endpoint to ask.
