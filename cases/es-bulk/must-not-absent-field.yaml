id: es-bulk/must-not-absent-field
protocol: es-bulk
title: must_not over a field some documents lack returns those documents

rule:
  basis: de-facto
  spec: elasticsearch/query-dsl
  section: bool.must_not
  text: >
    Elasticsearch defines the reference behaviour for this protocol. A must_not
    clause excludes documents that match the inner query and retains every
    other document, including those where the field does not exist and those
    where it is null, because neither matches the term. A backend claiming the
    Elasticsearch query API has to match that rather than SQL intuition, under
    which a comparison against a missing value is neither true nor false and
    the row is dropped. The difference is silent: no error, simply fewer rows.
  observed:
    - https://github.com/quickwit-oss/quickwit/issues/6474

send:
  format: es-ndjson
  body: cases/es-bulk/absent-field.ndjson

expect:
  ingest: accepted
  query:
    body: cases/es-bulk/must-not-absent-field.query.json
    returns: [with-field-other, field-absent, field-null]

notes: >
  The expectation was copied from what Elasticsearch 8.15.0 returned on
  2026-09-08, not written from reasoning about what it ought to do:
  [field-absent, field-null, with-field-other].

  `status` is a number on purpose. A string field is dynamically mapped as
  `text` with a `.keyword` subfield, so a term query on it matches nothing for
  reasons that have nothing to do with must_not — and a backend failing for
  that reason would look like it failed this check. That behaviour is worth
  isolating in a case of its own rather than confounding this one.

  Quickwit 0.8.2: PASS, confirmed 2026-09-08. It returns
  [field-absent, field-null, with-field-other], the same set as Elasticsearch
  8.15.0.

  quickwit#6474 does not reproduce on 0.8.2 with a dynamically mapped index.
  docs/TEST-CASES.md listed it as reported and not confirmed here; it has now
  been checked and is recorded as not reproducible on this version, which is a
  result rather than an absence of one. The case stays, because the behaviour
  is worth asserting continuously rather than once.

  OpenObserve v0.92.2: N/A, no Elasticsearch query endpoint to ask.
