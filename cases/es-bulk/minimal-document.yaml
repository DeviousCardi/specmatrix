id: es-bulk/minimal-document
protocol: es-bulk
title: An ordinary document survives the round trip
control: true

rule:
  basis: de-facto
  spec: elasticsearch/bulk
  text: >
    A control, not a divergence. Every other check in this suite assumes the
    adapter can write one document with _bulk and read it back with _search.
    When this does not pass, either the adapter is misconfigured or the backend
    cannot accept this shape of traffic at all, and no other row in the suite
    says anything about the backend.

send:
  format: es-ndjson
  body: cases/es-bulk/minimal-document.ndjson

expect:
  ingest: accepted
  readback:
    match: exact
    on: [message, level]

notes: >
  Elasticsearch 8.15.0: PASS, 200, round trip intact, confirmed 2026-09-08.
  This is the reference column for es-bulk, so a failure here would mean the
  adapter is wrong rather than the backend.
