id: otlp-logs/timestamp-outside-ingest-window
protocol: otlp-logs
title: A record the store will not keep is refused, not silently dropped

rule:
  basis: spec
  spec: opentelemetry/otlp/1.0
  section: otlphttp-response
  text: >
    On success the server MUST respond with HTTP 200. Where only part of a
    batch is kept, OTLP defines a partial success channel rather than an error:
    ExportLogsServiceResponse.partial_success carries rejected_log_records and
    error_message, and a server that discards records MUST report them there.
    The response body must also use the same encoding as the request, so a
    JSON-encoded export is answered with a JSON-encoded response. A store whose
    ingest window will not keep a record therefore has conformant answers
    available: refuse it with a 4xx, or accept and report the rejection in a
    partial_success the client can actually parse. What is not conformant is a
    notice the client cannot read, whether that is an empty partial_success or
    one encoded in a format the request did not use.
  observed:
    - https://github.com/VictoriaMetrics/VictoriaMetrics/issues/11526
    - https://github.com/openobserve/openobserve/issues/14293
    - docs/ROADMAP.md, 0.1 result, OpenObserve v0.92.2 at default settings

send:
  format: otlp-json
  encodings: [otlp-json, otlp-protobuf]
  body: cases/otlp-logs/timestamp-outside-ingest-window.json

expect:
  ingest: accepted-or-rejected
  readback:
    match: exact
    on: [body]

notes: >
  Either verdict at ingest is conformant: REJECT tells the client, and a store
  that keeps month-old data PASSes. What is not conformant is 200 followed by
  absence with no notice the client can read.

  Parseable v2.9.4: PASS, 200, round trip intact. It keeps a record dated
  thirty days ago.

  OpenObserve v0.92.2 at default settings: ALTER, "accepted (200) but never
  became queryable". The verdict is correct and the reason is more specific
  than the runner can currently see. Confirmed by hand on 2026-09-08:

    HTTP/1.1 200 OK
    content-type: application/json
    content-length: 182

  The body is not JSON. It is a protobuf-encoded ExportLogsServiceResponse
  carrying partial_success.rejected_log_records = 1 and

    error_message = "Too old data, only last 5 hours data can be ingested.
    Data discarded. You can adjust ingestion max time by setting the
    environment variable ZO_INGEST_ALLOWED_UPTO=<max_hours>"

  So OpenObserve does report the discard through the channel OTLP defines for
  it, and is not silently dropping data at the protocol level. The defect is
  narrower and still real: the export was JSON, the response must therefore be
  JSON, and the body is protobuf while the header announces
  content-type: application/json. No conformant OTLP/JSON client can parse it,
  so in practice the notice does not reach the caller and the record is gone
  without a readable word about it.

  The runner now reads partial_success and says what the store reported, so
  this row reads in full:

    ALTER  accepted (200) but never became queryable; store reported 1
           rejected record(s): Too old data, only last 5 hours data can be
           ingested...; request was JSON, response body is protobuf and
           content-type says application/json, so no conformant client can
           read that report

  The verdict stays ALTER. The record is gone, and a caller who trusted the
  200 is equally wrong whether or not an unreadable notice accompanied it. But
  a store that names what it dropped has behaved better than one that says
  nothing, and the detail now distinguishes them.

  Quickwit 0.8.2 gets the same encoding wrong in the other direction: it
  answers a protobuf export with a JSON body, also under
  content-type: application/json. Both are the same defect against the same
  requirement, that a response use the encoding of its request, and both are
  worth filing. Neither is a verdict of its own: no data is altered by a
  malformed response, and stretching ALTER to cover one would blunt the
  verdict this project exists to make sharp.

  Quickwit 0.8.2: PASS, round trip intact. It keeps a record dated thirty days
  ago, so of the three stores only OpenObserve discards out-of-window data.

  VictoriaLogs v1.52.0: ALTER, and the cleanest instance of exactly the
  behaviour this case was written for. Confirmed by hand on 2026-09-08:

    HTTP/1.1 200 OK
    Content-Length: 0

  A zero-length body is a valid but empty ExportLogsServiceResponse: it carries
  no partial_success, so it asserts that the whole batch was accepted. The
  record never becomes queryable.

  The cause is retention, not an ingest window: -retentionPeriod defaults to 7d
  and VictoriaLogs' own documentation says entries with timestamps outside it
  "are also rejected during data ingestion". A controlled comparison confirms
  it and rules out other causes — a 3-day-old record answers 200 and is found;
  the 30-day-old one answers 200 and is not.

  So the store considers the record rejected and the caller is told it
  succeeded. Where OpenObserve reports its discard through partial_success and
  merely encodes the report unreadably, VictoriaLogs sends nothing at all: no
  count, no message, no error. Of the two, this is the one a caller has no way
  to detect.

  Loki 3.1.1: PASS, and it is the store that shows what the conformant answer
  looks like. It refuses the record with a 400 and says exactly why:

    entry for stream '{service_name="specmatrix"}' has timestamp too old:
    2026-08-09T14:44:50Z, oldest acceptable timestamp is: ...

  The caller is told, at the door, in the response to the write. Three stores,
  three answers to the same payload:

    Loki 3.1.1           400 with a message naming the limit      PASS
    OpenObserve v0.92.2  200, partial_success in the wrong
                         encoding, record discarded               ALTER
    VictoriaLogs v1.52.0 200, Content-Length: 0, record
                         discarded                                ALTER

  Parseable v2.9.4 and Quickwit 0.8.2 simply keep the record, which is also
  fine. The divergence is not that stores have different retention — that is
  configuration — it is that two of them use the success path to report a
  failure while a third refuses and explains.
