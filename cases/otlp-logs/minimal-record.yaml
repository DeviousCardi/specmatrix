id: otlp-logs/minimal-record
protocol: otlp-logs
title: An ordinary log record survives the round trip
control: true

rule:
  basis: spec
  spec: opentelemetry/otlp/1.0
  text: >
    A control, not a divergence. Every other check in this suite assumes the
    adapter can write and read one record; when this fails the adapter is
    misconfigured and the rest of the suite says nothing about the backend.

send:
  format: otlp-json
  encodings: [otlp-json, otlp-protobuf]
  body: cases/otlp-logs/minimal-record.json

expect:
  ingest: accepted
  readback:
    match: exact
    on: [body, severityText]

notes: >
  Parseable v2.9.4: PASS, round trip intact. OpenObserve v0.92.2: PASS, round trip intact.

  Quickwit 0.8.2: PASS, round trip intact, sent as OTLP protobuf. The control
  passes on all three stores, so every other row in this suite says something
  about the backend rather than about the adapter.

  VictoriaLogs v1.52.0: PASS, round trip intact, sent as OTLP protobuf. Four
  stores now pass the control.

  Loki 3.1.1: PASS, round trip intact, 204. Five stores now pass the control.
  It accepts OTLP in both encodings, unlike Quickwit and VictoriaLogs.
