id: otlp-logs/timestamp-nanosecond-precision
protocol: otlp-logs
title: A nanosecond timestamp is stored at full precision

rule:
  basis: spec
  spec: opentelemetry-proto/logs/v1
  section: LogRecord.time_unix_nano
  text: >
    time_unix_nano is the time the event occurred, in nanoseconds since the
    Unix epoch. The specification defines the field's precision but does not
    say what a store must preserve, so this check records the stored value
    rather than asserting it. It becomes an exact check once two
    implementations disagree or the specification is clarified.

send:
  format: otlp-json
  encodings: [otlp-json, otlp-protobuf]
  body: cases/otlp-logs/timestamp-nanosecond-precision.json

expect:
  ingest: accepted
  readback:
    match: present
    on:
      - field: timeUnixNano
        as: timestamp

notes: >
  Observed on Parseable v2.9.4: sent "1755000000123456789", read back
  "2025-08-12T12:00:00.123". Stored as a millisecond-precision string, so the
  final six digits are dropped. Adjudication open.

  OpenObserve v0.92.2: sent "1755000000123456789", read back 1755000000123456.
  Stored as a microsecond integer, so the final three digits are dropped.

  The two stores disagree: Parseable keeps milliseconds as a string, OpenObserve
  keeps microseconds as an integer. Both discard nanoseconds, by different
  amounts and into different types. That disagreement is the condition the
  roadmap set for promoting this check to `exact`, but promotion needs a rule
  saying what a store must preserve, and the specification does not give one.
  Recorded, not adjudicated.

  Since 0.2 the field is read `as: timestamp`, so the result line names the type
  and the precision each store kept rather than printing two values that cannot
  be compared by eye. Confirmed 2026-09-08 with a generated instant:

    Parseable v2.9.4    sent "…123456789" (string, nanoseconds),
                        read back "2026-09-08T09:27:28.123" (string, milliseconds)
    OpenObserve v0.92.2 sent "…123456789" (string, nanoseconds),
                        read back 1788859648123456 (number, microseconds)

  Were this promoted to `exact`, both would fail: a typed comparison holds two
  instants equal only when they name the same nanosecond, so a store that
  dropped digits cannot pass by having both sides rounded to its own precision.
  That is the property that keeps the kind from becoming normalisation, and it
  is why promotion is still a question about the specification rather than
  about the runner.

  Quickwit 0.8.2 makes a third answer, and it is the one that showed the report
  needed to say more than the unit. Sent "...123456789", read back
  1788859957123456000: a nanosecond field holding a whole number of
  microseconds. Reported only by its unit this row would have read
  "nanoseconds" and claimed Quickwit preserved them, so `describe` now names
  the finest unit a value is a whole multiple of when that is coarser than the
  unit itself.

  Three stores, three behaviours, none of them nanoseconds:

    Parseable v2.9.4    "2026-09-08T09:31:55.123"  string, milliseconds
    OpenObserve v0.92.2 1788859915123456           number, microseconds
    Quickwit 0.8.2      1788859957123456000        number, nanoseconds holding
                                                   whole microseconds

  Still recorded rather than adjudicated. Three implementations disagreeing is
  not a rule about what a store must preserve, and the specification does not
  give one.

  VictoriaLogs v1.52.0 is the first store to keep the value intact. Sent
  "...123456789", read back "2026-09-08T14:36:09.123456789Z" — an RFC 3339
  string carrying every digit.

  That changes what this check knows. Three stores discarding nanoseconds by
  different amounts could be read as the precision simply being impractical to
  keep; a fourth keeping all of it shows it is a choice each store makes:

    Parseable v2.9.4    "2026-09-08T09:31:55.123"        string, milliseconds
    OpenObserve v0.92.2 1788859915123456                 number, microseconds
    Quickwit 0.8.2      1788859957123456000              number, nanoseconds
                                                         holding whole microseconds
    VictoriaLogs v1.52.0 "2026-09-08T14:36:09.123456789Z" string, nanoseconds

  Still recorded rather than adjudicated, and for the same reason as before:
  the specification says what the field means and not what a store must
  preserve. A rule is still missing, and one implementation proving the
  precision is keepable is not that rule. It does strengthen the case for
  asking the specification's owners the question.

  Loki 3.1.1: keeps every digit, read back "1788878689123456789" as a string of
  nanoseconds. Five stores, three answers:

    Parseable v2.9.4     "2026-09-08T09:31:55.123"         milliseconds
    OpenObserve v0.92.2  1788859915123456                  microseconds
    Quickwit 0.8.2       1788859957123456000               nanoseconds holding
                                                           whole microseconds
    VictoriaLogs v1.52.0 "2026-09-08T14:36:09.123456789Z"  nanoseconds
    Loki 3.1.1           "1788878689123456789"             nanoseconds

  Two of five keep the value intact, so the precision is plainly keepable. That
  is not the same as a rule saying it must be kept, and the specification still
  does not give one. Recorded, not adjudicated — but this is now a strong
  question to put to the specification's owners rather than a curiosity.
