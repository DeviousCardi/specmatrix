id: otlp-logs/empty-batch
protocol: otlp-logs
title: A request carrying no records is accepted

rule:
  basis: spec
  spec: opentelemetry/otlp/1.0
  text: >
    resourceLogs is a repeated field and may be empty. Collectors flush on a
    timer, so an empty export is ordinary traffic rather than an error, and a
    receiver that rejects it produces failures with no cause a user can act on.

  observed:
    - https://github.com/quickwit-oss/quickwit/issues/6784

send:
  format: otlp-json
  encodings: [otlp-json, otlp-protobuf]
  body: cases/otlp-logs/empty-batch.json

expect:
  ingest: accepted

notes: >
  No read-back: there is nothing to read. This check only asserts that an empty
  export is not treated as malformed.

  Parseable v2.9.4: PASS, 200. OpenObserve v0.92.2: PASS, 200.

  Quickwit 0.8.2: REJECT, 500. Confirmed by hand on 2026-09-08 with a
  zero-byte protobuf body, which is how an empty export encodes:

    $ curl -X POST localhost:7280/api/v1/otlp/v1/logs \
        -H 'Content-Type: application/x-protobuf' --data-binary ''
    {"message": "error when ingesting payload: status: Internal, message:
     \"\", details: [], metadata: MetadataMap { headers: {} }"}
    HTTP 500

  Parseable v2.9.4 and OpenObserve v0.92.2 both answer 200 to the same export.
  This is the first divergence in this suite where one store refuses what the
  other two accept, and the status makes it worse than a refusal: a 5xx tells a
  Collector the failure is the server's and to retry, so a batching Collector
  with nothing to send will retry an empty export indefinitely. The inner
  message is empty, so there is nothing for an operator to act on either.
  Report upstream.

  VictoriaLogs v1.52.0: PASS, 200. Three of the four stores accept an empty
  export; only Quickwit 0.8.2 answers 500, which is what makes that a finding
  about Quickwit rather than an unsettled question about the protocol.

  Loki 3.1.1: PASS, 204. Four of five stores accept an empty export; Quickwit
  0.8.2 alone answers 500.

  Loki 3.7.7: REJECT, 422 — a change from 3.1.1, confirmed by hand on
  2026-09-09 against grafana/loki:3.7.7 (`/loki/api/v1/status/buildinfo`
  reports version 3.7.7, revision 7a40404f, branch release-3.7.x). Both
  encodings are refused:

    $ curl -X POST localhost:3100/otlp/v1/logs \
        -H 'Content-Type: application/json' --data '{"resourceLogs":[]}'
    9error at least one valid stream is required for ingestion
    HTTP 422

    $ curl -X POST localhost:3100/otlp/v1/logs \
        -H 'Content-Type: application/x-protobuf' --data-binary ''
    9error at least one valid stream is required for ingestion
    HTTP 422

  Control, issued against the same container at the same moment: one valid
  record with a `service.name` resource attribute and a string body returned
  HTTP 204. So the container was healthy and accepting, and the refusal is
  specific to the empty export rather than a startup or readiness artefact.

  This is the second store to refuse an empty export, and it is a regression
  against the same clause Quickwit fails: OTLP's `docs/specification.md` says
  "If the server receives an empty request (a request that does not carry any
  telemetry data) the server SHOULD respond with success." Unlike Quickwit's
  500 it is a 4xx, so a Collector will not retry it indefinitely — the failure
  is loud rather than a retry storm — but conformant traffic is still refused,
  and a Collector flushing on a timer with nothing to send produces a steady
  stream of 422s with no user-actionable cause.

  Recorded separately: the error body is returned protobuf-framed (the leading
  `9` is a length prefix, not text) even when the request carried
  `Content-Type: application/json`, so a JSON client cannot read the reason it
  was refused. Same class as the OpenObserve response-encoding draft.
