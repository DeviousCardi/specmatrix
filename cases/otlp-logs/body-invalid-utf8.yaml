id: otlp-logs/body-invalid-utf8
protocol: otlp-logs
title: A body containing invalid UTF-8 is not silently rewritten

rule:
  basis: spec
  spec: opentelemetry-proto/common/v1
  section: AnyValue.string_value
  text: >
    Protobuf string fields must be valid UTF-8, and a conformant decoder is
    permitted to reject a payload that is not. Rejecting is a REJECT. Accepting
    and replacing the bytes is an ALTER unless the backend documents the
    replacement. Accepting and truncating the body is an ALTER regardless.
  observed:
    - https://github.com/grafana/loki/issues/24423
    - https://github.com/vectordotdev/vector/issues/20462

send:
  format: otlp-json
  body: cases/otlp-logs/body-invalid-utf8.json

expect:
  ingest: accepted
  readback:
    match: exact
    on: [body]

notes: >
  JSON-only by construction. A protobuf string field must be valid UTF-8, so
  this payload cannot exist on that wire and the case declares no `encodings`.
  A protobuf-only backend therefore reads N/A rather than passing a check it
  was never sent, which is the honest answer: the limit is the wire format's,
  not the backend's.

  Parseable v2.9.4: REJECT. "400 Could not deserialize into JSON object,
  invalid unicode code point at line 1 column 345". This is the behaviour the
  rule permits, so the verdict records what happens rather than reporting a
  fault: the caller is told, and no altered record is stored.

  OpenObserve v0.92.2: REJECT. "400 Invalid json: invalid unicode code point
  at line 1 column 345". Both stores refuse the payload rather than storing a
  rewritten body, which is the behaviour the rule permits.

  Quickwit 0.8.2: N/A. The case is JSON-only by construction and Quickwit's
  OTLP endpoint accepts protobuf only, so it was never sent. That is the
  honest answer rather than a pass or a failure.

  VictoriaLogs v1.52.0: N/A, for the same reason as Quickwit. It refuses OTLP
  JSON — "json encoding isn't supported for opentelemetry format. Use protobuf
  encoding", HTTP 400 — and this payload cannot exist as protobuf.

  Loki 3.1.1: ALTER, and the first store in the corpus to do what this case was
  written to catch. Confirmed by hand on 2026-09-08:

    ingest HTTP 204
    stored line : 'before-\ufffd\ufffd-after'
    utf-8 bytes : b'before-\xef\xbf\xbd\xef\xbf\xbd-after'

  The two invalid bytes 0xff 0xfe were each replaced with U+FFFD. Nothing
  errored, nothing warned, and the body that comes back is not the body that
  was sent. Parseable and OpenObserve refuse the same payload with a 400, which
  the rule also permits; Quickwit and VictoriaLogs never see it, because they
  take protobuf only and a protobuf string cannot carry those bytes.

  The rule permits replacement when a backend documents it, so this verdict is
  on the behaviour rather than on the documentation. If Loki documents the
  substitution, that belongs in this note and the finding becomes a much
  narrower one about discoverability. It has not been checked, and the issue
  filed upstream should ask rather than assert.
